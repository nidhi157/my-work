<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <canvas id="mycan" style="background: black;"></canvas>


    <script>
        var mycan = document.getElementById("mycan")
        
        var w = window.innerWidth
        var h = window.innerHeight

       
        var s = 10
        mycan.width= w
        mycan.height = h
        var x = 0
        var y = 0
        var r = 80
        var g = 80
        var b = 80
        var t = 2

        var c = mycan.getContext("2d");


        function f1()
        {
            for(var i = 1;i<800;i++)

            {
                t=Math.round(Math.random()*10)
                s=Math.round(Math.random()*t)
                r=Math.round(Math.random()*255)
                b=Math.round(Math.random()*255)

                c.fillStyle=`rgb(${r},${g},${b})`
                var y = Math.round(Math.random()*500)
                x = Math.round(Math.random()*1500)
                y = Math.round(Math.random()*500)
                c.beginPath();
                c.arc(x,y,s,0,2 * Math.PI);
                c.fill()
            }
            setTimeout(f1,100)
        }
             f1()
             //c.stroke();
             document.title ="no error"       
                

          
       


       
       

       
    </script>
</body>
</html>
