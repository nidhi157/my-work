<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Using While Loop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(135deg,#dbeafe,#bfdbfe,#93c5fd);
}

/* Header */
header{
width:100%;
background:linear-gradient(90deg,#1e3a8a,#2563eb,#3b82f6);
padding:22px 10px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}

header h1{
color:white;
font-size:34px;
text-shadow:2px 2px 5px rgba(0,0,0,.3);
}

/* Main */
.container{
width:100%;
padding:30px 15px;
text-align:center;
}

.mystyle{
width:50px;
height:50px;
border:none;
border-radius:50%;
color:white;
font-size:16px;
font-weight:bold;
margin:8px;
cursor:pointer;
box-shadow:3px 3px 6px grey;
transition:.3s;
}

.mystyle:hover{
 transform:scale(1.1);
}

/* Tablet */
@media(max-width:768px){

header h1{
font-size:28px;
}

.mystyle{
    width:46px;
    height:46px;
    font-size:15px;
    margin:7px;
}

}

/* Mobile */
@media(max-width:480px){

header{
    padding:18px 10px;
}

header h1{
    font-size:24px;
}

.container{
    padding:20px 10px;
}

.mystyle{
    width:42px;
    height:42px;
    font-size:14px;
    margin:6px;
}

}
</style>
</head>

<body>

<header>
    <h1>Using While Loop</h1>
</header>

<div class="container">

<script>
/* USING WHILE LOOP */

var a = 1;
var c = 1;
var r,g,b,mycolor;

while(a<=40)
{
    r = Math.round(Math.random()*255);
    g = Math.round(Math.random()*255);
    b = Math.round(Math.random()*255);

    mycolor = "rgb("+r+","+g+","+b+")";
    document.title = mycolor;

    document.write("<button style='background:"+mycolor+"' class='mystyle'>"+a+"</button>");

    a++;

    if(c<=5)
    {
        c++;
    }
    else
    {
        document.write("<br>");
        c=1;
    }
}
</script>

</div>

</body>
</html>
