<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table For Kids</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    text-align:center;
    color:#222;
    font-family:'Trebuchet MS', Arial, sans-serif;

    /* Background Image */
    background:url"k1.jpg";
    
}

header{
    width:100%;
    background:rgba(0,128,128,0.9);
    color:white;
    padding:18px;
    font-size:35px;
    font-family:'Comic Sans MS', cursive;
    font-weight:bold;
    box-shadow:0 3px 8px rgba(0,0,0,0.3);
    margin-bottom:20px;
}

.container{
    width:350px;
    margin:auto;
    background:rgba(255,255,255,0.85);
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px gray;
}

label{
    font-size:20px;
    font-weight:bold;
    color:#004d4d;
}

input{
    width:90%;
    padding:10px;
    font-size:18px;
    margin-top:10px;
    border:2px solid teal;
    border-radius:8px;
    outline:none;
    text-align:center;
}

button{
    margin-top:15px;
    padding:10px 25px;
    font-size:18px;
    background:teal;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#006666;
}

#result{
    margin-top:25px;
}

#result h1{
    color:#003333;
    margin:8px;
}
</style>

</head>

<body>

<header>
Table For Kids
</header>

<div class="container">

<label>Enter Table Number</label><br>

<input type="number" id="num" placeholder="Enter Number">

<br>

<button onclick="table()">Show Table</button>

<div id="result"></div>

</div>

<script>

function table()
{
    var n = document.getElementById("num").value;

    if(n=="")
    {
        alert("Please Enter a Number");
        return;
    }

    var data = "<h1>Table of "+n+"</h1>";

    for(var i=1;i<=10;i++)
    {
        data += "<h1>"+n+" ❌ "+i+" = "+(n*i)+"</h1>";
    }

    document.getElementById("result").innerHTML = data;
}

</script>

</body>
</html>
