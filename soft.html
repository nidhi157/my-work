<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Software</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:#0f172a;
color:white;
padding:30px;
}
/* Back Button */
.back-btn{
display:flex;
justify-content:center;
margin-bottom:20px;
}
.back-btn img{
width:30px;
cursor:pointer;
transition:.3s;
}
.back-btn img:hover{
transform:scale(1.1);
}
h1{
text-align:center;
margin-bottom:30px;
font-size:35px;
}
.folder-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}
.folder{
background:#1e293b;
padding:25px;
border-radius:15px;
text-align:center;
transition:.3s;
cursor:pointer;
text-decoration:none;
color:white;
}
.folder:hover{
background:#334155;
transform:translateY(-8px);
}
.folder img{
width:90px;
margin-bottom:15px;
}

.folder h3{
margin-bottom:8px;
font-size:22px;
}

.folder p{
font-size:14px;
color:#cbd5e1;
}

</style>

</head>
<body>
<div class="back-btn">
<a href="index.html">
<img src="images/back.png" alt="#">
</a>
</div>

<h1>💻 My Software Collection</h1>

<div class="folder-container">

<a href="practice page.html" class="folder">
<img src="images/f1.png">
<h3>HTML PRACTICE WORK</h3>
<p>Frontend Development with HTML</p>
</a>

<a href="java.html" class="folder">
<img src="images/f2.png">
<h3>JAVASCRIPT PRACTICE WORK</h3>
<p>Ineractive UI with JAVASCRIPT</p>
</a>


</div>

</body>
</html>
