<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login Page</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
color:white;
 }

.login-box{
width:350px;
background:#1e293b;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.login-box h1{
text-align:center;
margin-bottom:25px;
font-size:32px;
color:#f8fafc;
}
.input-box{
margin-bottom:18px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#cbd5e1;
}

.input-box input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:#334155;
color:white;
font-size:15px;
}
.input-box input::placeholder{
 color:#94a3b8;
 }
.login-btn{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#38bdf8;
color:#0f172a;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}
.login-btn:hover{
 background:#0ea5e9;
}
.extra{
margin-top:18px;
text-align:center;
font-size:14px;
color:#cbd5e1;
}
.extra a{
color:#38bdf8;
text-decoration:none;
}
.extra a:hover{
 text-decoration:underline;
 }
</style>
</head>

<body>
<div class="login-box">
<h1>Login</h1>

<form>
<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Enter your email">
</div>

<div class="input-box">
<label>Password</label>
<input type="password" placeholder="Enter your password">
</div>

<button type="submit" class="login-btn">Sign In</button>

<div class="extra">
        
<a href="#">#</a>
</div>
</form>
</div>

</body>
</html>
