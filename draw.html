<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Draw Tree in JavaScript</title>

    <style>

        body {
            margin: 0;
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: darkgreen;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        canvas {
            display: block;
            margin: 20px auto;
            background-color: lightblue;
            border: 1px black solid;
        }

    </style>

</head>

<body>

    <header>
        <h1>Draw Tree in JavaScript</h1>
    </header>

    <!-- for Raster Drawing -->

    <canvas id="mycan" width="500"></canvas>

    <script>

        // Vector drawing and Raster drawing

        var mycan = document.getElementById("mycan");

        var w = 600;
        var h = 600;

        mycan.width = w;
        mycan.height = h;

        var c = mycan.getContext("2d");


        // Rectangle / Tree Trunk

        c.fillStyle = "brown";
        c.fillRect(250, 350, 120, 250);


        // Tree Leaves - Left Circle

        c.beginPath();
        c.arc(220, 300, 100, 0, 2 * Math.PI);
        c.fillStyle = "green";
        c.fill();
        c.stroke();


        // Tree Leaves - Right Circle

        c.beginPath();
        c.arc(400, 300, 100, 0, 2 * Math.PI);
        c.fillStyle = "green";
        c.fill();
        c.stroke();


        // Tree Leaves - Middle Circle

        c.beginPath();
        c.arc(310, 200, 110, 0, 2 * Math.PI);
        c.fillStyle = "green";
        c.fill();
        c.stroke();


        // Tree Leaves - Top Circle

        c.beginPath();
        c.arc(310, 100, 80, 0, 2 * Math.PI);
        c.fillStyle = "green";
        c.fill();
        c.stroke();

    </script>

</body>

</html>
